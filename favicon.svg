<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- Isometric 3D Logistics Box -->
  <g filter="url(#shadow)" transform="translate(0, 1.5)">
    <!-- Top face -->
    <polygon points="32,14 49,23.5 32,33 15,23.5" fill="url(#boxTop)"/>
    <!-- Left face -->
    <polygon points="15,23.5 32,33 32,49.5 15,40" fill="url(#boxLeft)"/>
    <!-- Right face -->
    <polygon points="32,33 49,23.5 49,40 32,49.5" fill="url(#boxRight)"/>
    <!-- Box Tape Ribbon -->
    <polygon points="32,14 35.5,16 23.5,28 20,26" fill="#2563eb" fill-opacity="0.85"/>
    <polygon points="20,26 23.5,28 23.5,39 20,37" fill="#1d4ed8" fill-opacity="0.85"/>
    <!-- Center divider seam -->
    <line x1="32" y1="33" x2="32" y2="49.5" stroke="#1d4ed8" stroke-width="1" stroke-opacity="0.4"/>
  </g>
</svg>
